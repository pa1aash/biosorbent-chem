# ==============================================================================
# Chem-151 — CANONICAL NUMBERS
# S.T. Yau High School Science Award (Asia) 2026 · Palaash Gang
# ==============================================================================
#
# THE SINGLE SOURCE OF TRUTH FOR EVERY NUMBER THE REPORT STATES.
#
# No numeric result may be hard-coded in any .tex file. Every number reaches
# LaTeX through \num{key}, generated from this file by scripts/emit_numbers.py
# into report/preamble/numbers.tex.
#
#   data/provided/ -> analysis/src/ -> data/processed/ -> THIS FILE -> numbers.tex
#
# Schema, per key:
#   value           the number, or null
#   uncertainty     SD, or the half-width of the 95% CI; state which in `note`
#   n               replicate count, or null where not applicable
#   units           always explicit; never omitted
#   source_dataset  the DS-xx id from docs/DATA_REQUEST.md, or the script
#   status          PENDING | VERIFIED
#   note            optional; conventions, caveats, what the uncertainty means
#
# RULES
#   1. status: VERIFIED only when the value is derived from a real dataset by a
#      script in analysis/src/ or dft/analysis/. Never by hand.
#   2. emit_numbers.py REFUSES to emit a PENDING value except under --draft,
#      where it renders a loud red marker instead.
#   3. NOTHING here is pre-filled from the Stage-1 outline. The outline's values
#      are claims to be tested and live only in docs/02_PROTOCOL_AUDIT.md
#      Table C.
#   4. Significant figures are matched to measurement precision. If the SD is
#      +/-2 mg/g the value is 40.1, not 40.11.
#   5. Capacities carry BOTH mg/g and mmol/g keys. On a molar basis the ordering
#      inverts — see audit B10.2 and attack A23.
# ==============================================================================


